<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI',Inter,sans-serif">
  <defs>
    <radialGradient id="gc" cx="85%" cy="-8%" r="80%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/><stop offset="60%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gm" cx="0%" cy="112%" r="70%"><stop offset="0%" stop-color="#39ff9e" stop-opacity="0.10"/><stop offset="60%" stop-color="#39ff9e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.05"/></pattern>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#39ff9e"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#05070d"/><rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#gc)"/><rect width="1200" height="630" fill="url(#gm)"/>

  <text x="48" y="58" fill="#dbe7f5" font-size="26" font-weight="700" letter-spacing="2">ARCHOTEC <tspan fill="#22d3ee">COGNITIVE OS</tspan></text>
  <text x="48" y="100" fill="#e6f0ff" font-size="30" font-weight="700">We don't ask an LLM to answer. <tspan fill="url(#acc)">We ask it to engineer a system.</tspan></text>

  <!-- input bar -->
  <g transform="translate(48,132)">
    <rect width="1104" height="46" rx="10" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="18" y="30" font-family="'JetBrains Mono',monospace" font-size="15" fill="#9fb2c9">you &#9656; <tspan fill="#dbeeff">"build a hospital bed-management system"</tspan></text>
  </g>

  <!-- pipeline stages: 2 rows of cards with arrows -->
  <g font-family="'JetBrains Mono',monospace">
    <!-- row 1 -->
    <g transform="translate(48,210)">
      <rect width="250" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">1 &#183; PLAN</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">decompose the goal</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">into independent parts</text>
    </g>
    <line x1="298" y1="253" x2="338" y2="253" stroke="#22d3ee" marker-end="url(#arr)"/>
    <g transform="translate(338,210)">
      <rect width="250" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">2 &#183; ARCHITECT</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">design the organs</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">schema &#183; agents &#183; policy</text>
    </g>
    <line x1="588" y1="253" x2="628" y2="253" stroke="#22d3ee" marker-end="url(#arr)"/>
    <g transform="translate(628,210)">
      <rect width="250" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">3 &#183; GENERATE</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">write the code</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">one capability at a time</text>
    </g>
    <line x1="878" y1="253" x2="918" y2="253" stroke="#22d3ee" marker-end="url(#arr)"/>
    <g transform="translate(918,210)">
      <rect width="234" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">4 &#183; SANDBOX</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">run it isolated</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">no side effects</text>
    </g>

    <!-- down arrow -->
    <line x1="1035" y1="296" x2="1035" y2="330" stroke="#22d3ee" marker-end="url(#arr)"/>

    <!-- row 2 (right to left) -->
    <g transform="translate(918,330)">
      <rect width="234" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">5 &#183; TEST</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">keep only what passes</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">drop what doesn't</text>
    </g>
    <line x1="918" y1="373" x2="878" y2="373" stroke="#22d3ee" marker-start="url(#arr)"/>
    <g transform="translate(628,330)">
      <rect width="250" height="86" rx="11" fill="#0b1320" stroke="#16243c"/>
      <text x="16" y="26" fill="#22d3ee" font-size="12" letter-spacing="1">6 &#183; INTEGRATE</text>
      <text x="16" y="50" fill="#cfe0f2" font-size="13">wire the organs</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">verify end-to-end</text>
    </g>
    <line x1="628" y1="373" x2="588" y2="373" stroke="#22d3ee" marker-start="url(#arr)"/>
    <g transform="translate(338,330)">
      <rect width="250" height="86" rx="11" fill="#0b2018" stroke="#39ff9e" stroke-opacity="0.5"/>
      <text x="16" y="26" fill="#39ff9e" font-size="12" letter-spacing="1">7 &#183; OPERATIONAL</text>
      <text x="16" y="50" fill="#dffbe9" font-size="13">honest status report</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">what built &#183; what didn't &#183; why</text>
    </g>
    <line x1="338" y1="373" x2="298" y2="373" stroke="#39ff9e" marker-start="url(#arr)"/>
    <g transform="translate(48,330)">
      <rect width="250" height="86" rx="11" fill="#0b2018" stroke="#39ff9e" stroke-opacity="0.5"/>
      <text x="16" y="26" fill="#39ff9e" font-size="12" letter-spacing="1">8 &#183; INTERACT</text>
      <text x="16" y="50" fill="#dffbe9" font-size="13">open it &#183; query it &#183; use it</text>
      <text x="16" y="70" fill="#6f8099" font-size="11.5">immediately</text>
    </g>
  </g>

  <!-- footer -->
  <text x="48" y="476" fill="#e6f0ff" font-size="19" font-weight="600">From one sentence to a running, inspectable system <tspan fill="url(#acc)">&#8212; and when a part can't be built, it says so.</tspan></text>
  <g transform="translate(48,500)" font-family="'JetBrains Mono',monospace">
    <rect width="360" height="36" rx="8" fill="#0f2418" stroke="#39ff9e" stroke-opacity="0.4"/>
    <text x="14" y="23" font-size="12.5" fill="#9affc9">It plans &#183; builds &#183; tests &#183; integrates</text>
    <rect x="376" width="430" height="36" rx="8" fill="#2a1c0c" stroke="#ffae5c" stroke-opacity="0.4"/>
    <text x="390" y="23" font-size="12.5" fill="#ffce9c">and tells you exactly what failed and why</text>
  </g>
  <text x="48" y="590" font-family="'JetBrains Mono',monospace" font-size="12" fill="#52647d">local &#183; single GPU &#183; every capability sandbox-tested before it goes live &#183; nothing leaves the machine</text>
</svg>
