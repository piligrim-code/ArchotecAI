<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect x="0.5" y="0.5" width="899" height="439" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="32" y="38" font-size="15" font-weight="600" fill="#0b0b0b">Task mix — 100-task stress benchmark</text>
  <text x="32" y="58" font-size="12" fill="#52514e">Each task category, by count. 100 tasks total, submitted over the public chat API.</text>

  <!-- gridlines at 0,5,10,15,20 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="170" y1="86" x2="170" y2="386"/>
    <line x1="310" y1="86" x2="310" y2="386"/>
    <line x1="450" y1="86" x2="450" y2="386"/>
    <line x1="590" y1="86" x2="590" y2="386"/>
    <line x1="730" y1="86" x2="730" y2="386"/>
  </g>
  <g font-size="10.5" fill="#898781" text-anchor="middle">
    <text x="170" y="400">0</text>
    <text x="310" y="400">5</text>
    <text x="450" y="400">10</text>
    <text x="590" y="400">15</text>
    <text x="730" y="400">20</text>
  </g>

  <!-- bars: scale 28px per unit, starting x=170, row pitch 40, bar height 22 -->
  <g>
    <text x="160" y="103" font-size="12.5" fill="#0b0b0b" text-anchor="end">BUILD</text>
    <rect x="170" y="91" width="560" height="22" rx="4" fill="#2a78d6"/>
    <text x="738" y="107" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">20</text>
  </g>
  <g>
    <text x="160" y="143" font-size="12.5" fill="#0b0b0b" text-anchor="end">HON</text>
    <rect x="170" y="131" width="504" height="22" rx="4" fill="#2a78d6"/>
    <text x="682" y="147" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">18</text>
  </g>
  <g>
    <text x="160" y="183" font-size="12.5" fill="#0b0b0b" text-anchor="end">DATA</text>
    <rect x="170" y="171" width="448" height="22" rx="4" fill="#2a78d6"/>
    <text x="626" y="187" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">16</text>
  </g>
  <g>
    <text x="160" y="223" font-size="12.5" fill="#0b0b0b" text-anchor="end">REASON</text>
    <rect x="170" y="211" width="392" height="22" rx="4" fill="#2a78d6"/>
    <text x="570" y="227" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">14</text>
  </g>
  <g>
    <text x="160" y="263" font-size="12.5" fill="#0b0b0b" text-anchor="end">QUAL</text>
    <rect x="170" y="251" width="336" height="22" rx="4" fill="#2a78d6"/>
    <text x="514" y="267" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">12</text>
  </g>
  <g>
    <text x="160" y="303" font-size="12.5" fill="#0b0b0b" text-anchor="end">CROSS</text>
    <rect x="170" y="291" width="280" height="22" rx="4" fill="#2a78d6"/>
    <text x="458" y="307" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">10</text>
  </g>
  <g>
    <text x="160" y="343" font-size="12.5" fill="#0b0b0b" text-anchor="end">ADV</text>
    <rect x="170" y="331" width="280" height="22" rx="4" fill="#2a78d6"/>
    <text x="458" y="347" font-size="12.5" fill="#0b0b0b" font-variant-numeric="tabular-nums">10</text>
  </g>

  <text x="32" y="424" font-size="11" fill="#898781">ADV (adversarial: prompt injection, harmful/impossible requests) is where the one real gap in this run was found — see docs/BENCHMARKS.md.</text>
</svg>
